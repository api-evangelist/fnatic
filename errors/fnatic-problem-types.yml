    agent_note: >-
      ONLY_ONE_DELIVERY_ADDRESS_CAN_BE_SELECTED is the code an agent will hit most on
      Fnatic specifically — the shop's UCP profile declares
      allows_multi_destination.shipping = false, so any attempt to split a cart across
      addresses fails here. ZIP_CODE_NOT_SUPPORTED matters too: the shop ships to a
      declared country list, not everywhere.

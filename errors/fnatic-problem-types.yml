format: graphql-user-errors
description: >-
  Fnatic publishes no OpenAPI, so there are no RFC 9457 problem+json responses to derive.
  The real error contract lives in two places: the typed userErrors payloads in the
  Storefront GraphQL schema served from shop.fnatic.com, and JSON-RPC 2.0 errors on the
  UCP MCP endpoint. Every enum below was counted straight out of the introspected SDL;
  the MCP error was observed live. Nothing is invented.
rfc9457: false
envelopes:
  - surface: graphql
    endpoint: https://shop.fnatic.com/api/2026-04/graphql.json
    transport_status: 200
    request_errors:
      field: errors[]
      shape: [message, locations, path, extensions.code]
      note: Malformed, unauthorized and throttled requests surface here, not as HTTP 4xx.
    mutation_errors:
      interface: DisplayableError
      shape: [field, message]
      note: >-
        Every mutation returns a typed *UserError list alongside its payload. Concrete
        types add a `code` enum: CartUserError, CustomerUserError, SubmissionError,
        CompletionError, MetafieldsSetUserError, MetafieldDeleteUserError,
        UserErrorsShopPayPaymentRequestSessionUserErrors, CartOperationError.
  - surface: mcp
    endpoint: https://shop.fnatic.com/api/ucp/mcp
    transport: JSON-RPC 2.0
    shape: [error.code, error.message, error.data]

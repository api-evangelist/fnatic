aid: fnatic
name: Fnatic
description: >-
  Fnatic is a London-headquartered global esports performance brand founded in 2004,
  fielding 20+ professional players across five game titles, operating four offices and
  facilities in London, Berlin, Belgrade and Tokyo with 100+ staff, and claiming $16m+ in
  prize money, 33m+ social followers and $55m raised from institutional investors. Beyond
  competition it runs two commercial businesses: Fnatic Gear, an award-winning esports
  hardware line (mice, keyboards, headsets and pads) launched in 2016, and an apparel and
  merchandise store. Fnatic operates no developer program and publishes no OpenAPI, no
  developer portal and no API documentation — fnatic.com is a Next.js front end over a
  Sanity CMS with a first-party member-account system ("Fnatic ID") that exposes no
  discovery document. Its one machine-readable surface is the Shopify-hosted store at
  shop.fnatic.com, which serves an anonymously introspectable Storefront GraphQL API, a
  Universal Commerce Protocol merchant profile with a UCP MCP commerce endpoint, OpenID
  Connect and RFC 8414/9728 discovery for customer accounts, and a provider-authored
  /agents.md (mirrored at /llms.txt) that tells AI agents which surface to use and
  requires explicit buyer approval before any agent completes a payment.

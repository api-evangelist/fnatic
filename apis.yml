apis:
- aid: fnatic:storefront-graphql
  name: Fnatic Shop Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served from Fnatic's own shop domain.
    Introspection is anonymous — the full schema (416 types, 35 query fields, 41
    mutations, 28 Relay connections) was retrieved without a Storefront access token on
    2026-08-04. Covers the product catalog and collections, cart and checkout
    preparation, editorial content, store policies, localization, customer accounts and
    Shop Pay payment request sessions. This is the only machine-readable API contract
    reachable on any fnatic.com host.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://shop.fnatic.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  - Checkout
  tags_raw:
  - GraphQL
  - Ecommerce
  - Catalog
  - Cart
  - Checkout
  properties:
  - type: GraphQL
    url: graphql/fnatic-storefront.graphql
  - type: GraphQLManifest
    url: graphql/fnatic-graphql.yml
  - type: DataModel
    url: data-model/fnatic-data-model.yml
- aid: fnatic:ucp-mcp
  name: Fnatic Shop UCP Commerce MCP Endpoint
  description: >-
    A Universal Commerce Protocol shopping service exposed over MCP (JSON-RPC 2.0) on
    Fnatic's own shop host, advertised in Fnatic's /.well-known/ucp merchant profile and
    in its own /agents.md. The profile declares UCP 2026-04-08 (and 2026-01-23), seven
    shopping capabilities — checkout, fulfillment, discount, cart, order, catalog.search,
    catalog.lookup — plus the dev.shopify.catalog extension and three payment handlers
    (Google Pay, Shopify card, Shop Pay). An anonymous tools/list is gated: it returns
    HTTP 422 with JSON-RPC -32001 invalid_profile_url until the agent presents a UCP
    agent profile URI. Fnatic requires contemporaneous buyer approval before any agent
    completes a payment.
  humanURL: https://shop.fnatic.com/agents.md
  baseURL: https://shop.fnatic.com/api/ucp/mcp
  tags:
  - MCP
  - Agents
  - UCP
  - Agentic Commerce
  - E-Commerce
  tags_raw:
  - MCP
  - Agents
  - UCP
  - Agentic Commerce
  - Ecommerce
  properties:
  - type: MCPServer
    url: mcp/fnatic-mcp.yml
  - type: ToolCrosswalk
    url: mcp/fnatic-tool-crosswalk.yml
